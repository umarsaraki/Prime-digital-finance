// CANZA CURRENCY
function switchCurrency() {
    currency = document.getElementById('currency').value;
    localStorage.setItem('currency', currency);

// BUY PLAN FUNCTION - GYARA DON POLICY
async function buyPlan(vip, priceNaira, priceDollar, dailyUSD) {
    if(!currentUser) return showToast('Please login first', 'error');
    
    let newBalanceNgn = currentUser.balance_ngn;
    let newBalanceUsd = currentUser.balance_usd;
    let cost = currency === 'USD' ? priceDollar : priceNaira;

    if(currency === 'USD'){
        if(currentUser.balance_usd < cost) return showToast('Insufficient USD Balance', 'error');
        newBalanceUsd = currentUser.balance_usd - cost;
    } else {
        if(currentUser.balance_ngn < cost) return showToast('Insufficient NGN Balance', 'error');
        newBalanceNgn = currentUser.balance_ngn - cost;
    }
    
    const { error } = await supabase.from('users').update({
        balance_ngn: newBalanceNgn,
        balance_usd: newBalanceUsd,
        vip_level: vip,
        daily_earning_usd: dailyUSD,
        daily_earning_ngn: dailyUSD * rate,
        plan_start: new Date().toISOString(),
        vip_expiry_date: new Date(Date.now() + 60 * 24 * 60 * 60 * 1000).toISOString(), // 60 days
        current_vip_id: `VIP${vip}`
    }).eq('id', currentUser.id);

    if(error) return showToast('Error purchasing plan: ' + error.message, 'error');
    
    currentUser.balance_ngn = newBalanceNgn;
    currentUser.balance_usd = newBalanceUsd;
    updateUI();
    showToast(`VIP ${vip} Activated!`, 'success');
}

// DEPOSIT FUNCTION - DA PAYMENT LINK
function deposit() {
    if(!currentUser) return showToast('Please login first', 'error');
    const paymentLink = "https://flutterwave.com/pay/primedigitalfinance"; 
    window.open(paymentLink, '_blank'); 
    showToast('Redirecting to payment page...', 'success');
}

// LOAD USER DATA
async function loadUser() {
    const email = localStorage.getItem('userEmail');
    if(!email) {
        showToast('Please login first', 'error');
        window.location.href = 'auth.html';
        return;
    }
    document.getElementById('currency').value = currency; 
    
    const { data, error } = await supabase.from('users').select('*').eq('email', email).single();
    if(error || !data) return showToast('Error loading user: ' + error.message, 'error');
    
    currentUser = data;
    updateUI();
    checkDailyEarning(data);
}

function updateUI() {
    document.getElementById('username').innerText = currentUser.fullname;
    document.getElementById('vip').innerText = 'VIP ' + (currentUser.vip_level || 0);
    
    const balance = currency === 'USD' ? currentUser.balance_usd.toFixed(2) : currentUser.balance_ngn.toLocaleString();
    const symbol = currency === 'USD' ? '$' : '₦';
    document.getElementById('balance').innerText = `${symbol}${balance}`;
}

// DAILY EARNING COUNTING - GYARA DON POLICY
async function checkDailyEarning(user) {
    if(!user.plan_start || !user.daily_earning_usd) return;
    const lastClaim = new Date(user.last_earning || user.plan_start);
    const now = new Date();
    const hoursDiff = (now - lastClaim) / (1000 * 60 * 60);
    
    if(hoursDiff >= 24) {
        const earningNgn = user.daily_earning_ngn || (user.daily_earning_usd * rate);
        const earningUsd = user.daily_earning_usd;
        
        const newBalanceNgn = user.balance_ngn + earningNgn;
        const newBalanceUsd = user.balance_usd + earningUsd;
        const newTotalNgn = (user.total_earned_ngn || 0) + earningNgn;
        const newTotalUsd = (user.total_earned_usd || 0) + earningUsd;

        await supabase.from('users').update({
            balance_ngn: newBalanceNgn,
            balance_usd: newBalanceUsd,
            total_earned_ngn: newTotalNgn,
            total_earned_usd: newTotalUsd,
            last_earning: now.toISOString() // idan kana da wannan column
        }).eq('id', user.id);
        
        currentUser.balance_ngn = newBalanceNgn;
        currentUser.balance_usd = newBalanceUsd;
        updateUI();
        const earning = currency === 'USD' ? `$${earningUsd}` : `₦${earningNgn.toLocaleString()}`;
        showToast(`Daily Earning Credited: ${earning}`, 'success');
    }
}
