name = "prime-digital-finance"
main = "worker.js"
compatibility_date = "2026-11-23"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/media/*"]

[[d1_databases]]
binding = "DB"
database_name = "pdf_usdt_db"
database_id = "13b389e0-784a-477c-8ae9-1369f637b6b5"

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "prime-digital-finance-uploads"

[vars]
PRIMARY_ADMIN_EMAIL = "umarsaraki96@gmail.com"
# Optional: lock API calls to your own domain, e.g. APP_ORIGIN = "https://your-domain.com"
# APP_ORIGIN = ""

# SECRET (do not write it here). Set it once with:
#   npx wrangler secret put ADMIN_SETUP_KEY
# The owner e-mail above can only be registered by entering this key on the register form.
